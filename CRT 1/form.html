<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Registration Form</h1>

    <form>
        <label for="name">Name:</label>
        <input id="name" name="name" type="text" required>
        <br><br>

        <label for="email">Email address: </label>
        <input id="email" name="email" type="email" required>
        <br><br>

        <label for="address">Address:</label>
        <input id="address" name="address" type="text" required>
        <br><br>


        <label for="Age">Age:</label>
        <input id="Age" name="Age" type="number" required>
        <br><br>

        <label for="password">Password:</label>
        <input id="password" name="password" type="password" required>
        <br><br>

        <label for="Gender">Gender:</label>
        <li>Male <input id="Gender" name="Gender" type="radio" required></li>
        <li>FeMale <input id="Gender" name="Gender" type="radio" required></li>
        <br><br>

        <label for="Department">Department</label>
        <li>CSE <input type="radio"></li>
        <li>AIDS <input type="radio"></li>
        <li>Cloud <input type="radio"></li>
        <li>Cyber <input type="radio"></li>
        <br><br>

         <label for="City">City:</label>
        <input id="City" name="City" type="text" required>
        <br><br>
        

        <input type="submit" value="Submit">
    </form>
</body>
</html>
