<!DOCTYPE html>
<html>
<head>
    <title>Facebook Login</title>

    <link rel="stylesheet" href="dex.css">
        
</head>

<body>

    <div class="container">

        <h1>Instagram</h1>

        <div class="login-box">

            <h3>Log in to Instagram</h3>

            <form>

                <input 
                    type="text" 
                    placeholder="Email or phone number"
                >

                <input 
                    type="password" 
                    placeholder="Password"
                >

                <button class="login-btn">
                    Log In
                </button>

            </form>

            <a href="#" class="forgot">
                Forget password?
            </a>

            <hr>

            <button class="create-btn">
                Create New Account
            </button>

        </div>

    </div>

</body>
</html>
