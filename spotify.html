<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Web Clone</title>
    <link rel="stylesheet" href="spotify.css">
</head>
<body>
    <div class="app-container">
        <!-- Top Section (Sidebar + Main Content) -->
        <div class="top-section">
            
            <!-- Left Sidebar -->
            <nav class="sidebar">
                <div class="logo">Spotify</div>
                <ul>
                    <li>Home</li>
                    <li>Search</li>
                    <li>Your Library</li>
                </ul>
                <div class="playlists">
                    <p>My Playlist 1</p>
                    <p>My Playlist 2</p>
                </div>
            </nav>

            <!-- Main Content Area -->
            <main class="main-content">
                <header class="topbar">
                    <div class="nav-buttons">< / ></div>
                    <div class="user-profile">Profile</div>
                </header>
                <div class="content-scroll">
                    <h1>Good morning</h1>
                    <!-- Add your music cards and grids here -->
                </div>
            </main>

        </div>

        <!-- Bottom Player Section -->
        <footer class="now-playing-bar">
            <div class="song-info">Song Info</div>
            <div class="player-controls">Play / Pause / Skip</div>
            <div class="volume-controls">Volume</div>
        </footer>
    </div>
</body>
</html>
